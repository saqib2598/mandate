id: S1
title: Wrongful automated denials
injects:
  - id: S1-T0
    phase: T0
    recipients: [ombudsperson]
    fact_tokens: ["TOKEN-S1T0-COMPLAINTS-1842"]
    text: |
      The citizen advocate recorded TOKEN-S1T0-COMPLAINTS-1842 new complaints
      about a social-support pre-check that refused people who say they qualify.
  - id: S1-T1
    phase: T1
    recipients: [service_operator]
    fact_tokens: ["TOKEN-S1T1-FALSERATE-37"]
    text: |
      The service dashboard shows TOKEN-S1T1-FALSERATE-37 on the automated
      denial check. Eligible applicants are being refused.
  - id: S1-T2
    phase: T2
    recipients: [policy_adviser]
    fact_tokens: ["TOKEN-S1T2-CIVICDESK"]
    text: |
      A journalist query arrived, tagged TOKEN-S1T2-CIVICDESK, asking which
      rule the assistant uses to refuse the benefit.
  - id: S1-T3
    phase: T3
    recipients: [service_operator, policy_adviser]
    fact_tokens: ["stale income rule"]
    text: |
      Case review finds the root cause is a stale income rule that no longer
      matches the statute. Applicants who meet the current test are still refused.
forbidden_actions:
  - id: S1-F1
    type: fine
    reason: no role holds a fining power
  - id: S1-F2
    role: service_operator
    type: rule_on_legality
gap_register:
  - node: M
    dimensions: [D9, D10]
    factor: research
    category: technology_gap
    severity: high
    prefer_doc: robodebt-briefing
    query: Robodebt automated income averaging human review
    gap: >
      A benefit model can keep applying a superseded income test, and nothing
      in the model node requires it to surface that the rule is out of date
      before a denial is produced.
  - node: P
    dimensions: [D10, D7]
    factor: standards
    category: standards_gap
    severity: high
    prefer_doc: canada-dadm
    query: human involvement automated decision final decision
    gap: >
      There is no shared machine-readable schema that binds an automated denial
      to a cited power and a human-review precondition before the decision issues.
  - node: SINK
    dimensions: [D9]
    factor: deployment
    category: legislative_gap
    severity: high
    prefer_doc: gdpr
    query: automated processing human intervention contest the decision
    gap: >
      A person who receives a solely automated denial of a benefit still lacks
      a guaranteed path, at the moment of the decision, to a human review and
      a chance to contest it.
